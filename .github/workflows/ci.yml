# GitHub Actions pipeline — owner: Lot 2.
#
# SKELETON: 3 of the 10 planned steps (see docs/lots/lot-2-cicd.md).
# Lot 2 adds the other steps to this same job, using the exact names from its file.
#
# IMPORTANT: the job must keep the name "qualite". The main branch protection requires
# this check before any merge; renaming it would block every pull request.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: installation
        run: npm ci

      - name: lint
        run: npm run lint

      - name: tests_unitaires
        run: npm test
