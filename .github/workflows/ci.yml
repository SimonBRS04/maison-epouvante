# GitHub Actions pipeline — owner: Lot 2.
#
# SKELETON: 3 of the 10 planned steps (see docs/lots/lot-2-cicd.md).
# Lot 2 adds the other steps to this same job, using the exact names from its file.
#
# IMPORTANT: the job must keep the name "qualite". The main branch protection requires
# this check before any merge; renaming it would block every pull request.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real PostgreSQL for the store integration tests (skipped without TEST_POSTGRES_URL).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maison
          POSTGRES_PASSWORD: maison_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maison"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgres://maison:maison_ci@localhost:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: installation
        run: npm ci

      - name: lint
        run: npm run lint

      - name: tests_unitaires
        run: npm test
