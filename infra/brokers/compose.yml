# Kafka + RabbitMQ for the "brokers" benchmark — owner: Lot 4.
#
#   docker compose -f infra/brokers/compose.yml up -d            both brokers
#   docker compose -f infra/brokers/compose.yml up -d rabbitmq   one broker only (fair measurement)
#   docker compose -f infra/brokers/compose.yml down             stop and wipe everything
#
# Versions are pinned so that two official runs always compare the same software.
# Same resources for both brokers (socle commun, section 7): 2 CPUs, 2 GB of memory.
# No volume on purpose: `down` gives a clean broker, while `docker kill` + `docker start`
# keeps the container filesystem, so persisted messages survive a simulated crash.

name: maison-epouvante-brokers

services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: brokers-kafka
    hostname: kafka
    ports:
      - '9092:9092'
    cpus: '2'
    mem_limit: 2g
    environment:
      # Single node in KRaft mode: the same process is broker and controller (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two advertised listeners: the client connects, then reconnects to the advertised
      # address. The host (benchmark) must get localhost:9092, the containers kafka:29092.
      # With a single listener, one side connects and then fails "mysteriously".
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # Internal topics default to 3 replicas, impossible on a single node.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # An auto-created topic gets 1 partition and silently breaks the ordering scenarios:
      # the "offers" topic (3 partitions) is created explicitly by the benchmark instead.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null',
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.4.1-management
    container_name: brokers-rabbitmq
    # RabbitMQ names its node and its data folder after the hostname: keep it stable.
    hostname: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672' # management console
    cpus: '2'
    mem_limit: 2g
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
